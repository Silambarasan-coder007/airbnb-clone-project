<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airbnb – Homes in India</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff385c'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="search">
  <header class="nav">
    <a href="index.html" class="brand"><img referrerpolicy="no-referrer" src="https://download.logo.wine/logo/Airbnb/Airbnb-Logo.wine.png" alt="Airbnb home"></a>
    <a class="menu" href="index.html#search" aria-label="Edit your search">
      <span class="house" aria-hidden="true">🏠</span>
      <span id="pill-loc">Homes in India</span><i></i>
      <span id="pill-dates">Any week</span><i></i>
      <span id="pill-guests">1 guest</span>
      <span class="pink" aria-hidden="true"><svg width="16" height="16" fill="#fff" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg></span>
    </a>
    <button id="open-filters" class="fbtn" type="button" aria-haspopup="dialog">Filters <span id="fcount"></span></button>
  </header>

  <main class="layout">
    <section class="left" aria-labelledby="count">
      <div class="bar">
        <div>
          <h1 id="count">Homes in India</h1>
          <p class="note">🏷️ Prices include all fees</p>
        </div>
        <label class="sort">Sort by
          <select id="sort">
            <option value="recommended">Recommended</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="rating">Top rated</option>
          </select>
        </label>
      </div>
      <div class="grid" id="results" aria-live="polite"></div>
    </section>

    <aside class="right" aria-label="Map">
      <iframe id="map" title="Map of stays" loading="lazy"
        src="https://www.openstreetmap.org/export/embed.html?bbox=68%2C6%2C98%2C36&amp;layer=mapnik"></iframe>
      <small><a id="map-link" href="https://www.openstreetmap.org/#map=4/22/80" target="_blank" rel="noopener">View larger map</a></small>
      <p class="hint">Select a home to see it on the map.</p>
    </aside>
  </main>

  <dialog id="filters" aria-labelledby="filters-title">
    <form id="filter-form">
      <h2 id="filters-title">Filters</h2>
      <label class="field">Max price per night (₹)<input type="number" name="max" min="0" step="100" placeholder="No limit"></label>
      <fieldset><legend>Type of place</legend><div id="f-types" class="checks"></div></fieldset>
      <fieldset><legend>Amenities</legend><div id="f-amenities" class="checks"></div></fieldset>
      <div class="actions">
        <button type="button" id="clear-filters" class="ghost">Clear all</button>
        <button type="button" id="close-filters" class="ghost">Cancel</button>
        <button type="submit" class="primary">Show homes</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="search.js"></script>
</body>
</html>
